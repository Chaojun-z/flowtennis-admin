name: Feishu Changelog

on:
  schedule:
    - cron: '10 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  send-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      FEISHU_CHANGELOG_WEBHOOK: ${{ secrets.FEISHU_CHANGELOG_WEBHOOK }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      CHANGELOG_DATA_UPDATE_ISSUE_NUMBER: ${{ vars.CHANGELOG_DATA_UPDATE_ISSUE_NUMBER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: standalone-services/package-lock.json

      - name: Install standalone service dependencies
        run: npm ci
        working-directory: standalone-services

      - name: Restore changelog sent state
        uses: actions/cache/restore@v4
        with:
          path: standalone-services/changelogs/sent-state.json
          key: feishu-changelog-sent-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            feishu-changelog-sent-

      - name: Send Feishu changelog
        run: node feishu-changelog.js
        working-directory: standalone-services
        env:
          CHANGELOG_SENT_STATE: changelogs/sent-state.json

      - name: Save changelog sent state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: standalone-services/changelogs/sent-state.json
          key: feishu-changelog-sent-${{ github.run_id }}-${{ github.run_attempt }}

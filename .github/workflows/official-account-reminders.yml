name: Official Account Reminders

on:
  schedule:
    - cron: '2,32 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-official-account-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.FLOWTENNIS_ADMIN_TOKEN }}
      TARGET_URL: https://www.flowtennis.cn/api/cron/official-account-reminders

    steps:
      - name: Trigger reminder endpoint
        shell: bash
        run: |
          hour=$(date +%H)
          if [ "$hour" -ge 23 ] || [ "$hour" -lt 5 ]; then
            echo "Quiet hours, skip reminder run."
            exit 0
          fi

          curl_args=(-fsS -X GET "$TARGET_URL" -H "User-Agent: vercel-cron")
          if [ -n "${CRON_SECRET:-}" ]; then
            curl_args+=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi
          curl "${curl_args[@]}"

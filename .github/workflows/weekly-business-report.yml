name: Weekly Business Report

on:
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-weekly-business-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.FLOWTENNIS_ADMIN_TOKEN }}
      TARGET_URL: https://www.flowtennis.cn/api/cron/weekly-business-report
      TS_ENDPOINT: ${{ secrets.FLOWTENNIS_TS_ENDPOINT }}
      TS_INSTANCE: ${{ secrets.FLOWTENNIS_TS_INSTANCE }}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.FLOWTENNIS_ALIYUN_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.FLOWTENNIS_ALIYUN_ACCESS_KEY_SECRET }}
      DIAG_TOKEN: ${{ secrets.DIAG_TOKEN || secrets.FLOWTENNIS_ADMIN_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Rebuild weekly report snapshots
        run: node scripts/rebuild-operations-snapshot.js --write --weekly-report-scopes --skip-default-scope

      - name: Trigger weekly business report
        shell: bash
        run: |
          curl_args=(-fsS -X GET "$TARGET_URL" -H "User-Agent: github-actions-weekly-business-report")
          if [ -n "${CRON_SECRET:-}" ]; then
            curl_args+=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi
          curl "${curl_args[@]}"

name: Operations Snapshot Rebuild

on:
  schedule:
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-operations-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      TZ: Asia/Shanghai
      TS_ENDPOINT: ${{ secrets.FLOWTENNIS_TS_ENDPOINT }}
      TS_INSTANCE: ${{ secrets.FLOWTENNIS_TS_INSTANCE }}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.FLOWTENNIS_ALIYUN_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.FLOWTENNIS_ALIYUN_ACCESS_KEY_SECRET }}
      DIAG_TOKEN: ${{ secrets.DIAG_TOKEN || secrets.FLOWTENNIS_ADMIN_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Rebuild operations snapshot
        run: |
          node scripts/rebuild-operations-snapshot.js --write --view coach --common-scopes --shard-count 6 --shard-index ${{ matrix.shard }}
          node scripts/rebuild-operations-snapshot.js --write --view coach --daily-month-scopes --skip-default-scope --daily-from 2026-08-01 --daily-to 2026-12-31 --shard-count 6 --shard-index ${{ matrix.shard }}

name: Operations Snapshot Rebuild

on:
  schedule:
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-operations-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.FLOWTENNIS_ADMIN_TOKEN }}
      TARGET_URL: https://www.flowtennis.cn/api/cron/operations-snapshot/rebuild

    steps:
      - name: Trigger operations snapshot rebuild
        shell: bash
        run: |
          curl_args=(-fsS -X GET "$TARGET_URL" -H "User-Agent: vercel-cron")
          if [ -n "${CRON_SECRET:-}" ]; then
            curl_args+=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi
          curl "${curl_args[@]}"

name: Feishu Coach Daily Digests

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      coachName:
        description: '只发送某位教练；留空则发送全部'
        required: false
        default: ''
      markSent:
        description: '是否写入已发送标记；测试单发建议 false'
        required: false
        default: 'true'
      force:
        description: '是否忽略已发送标记；只用于指定单个教练补发'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  send-feishu-coach-digests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.FLOWTENNIS_ADMIN_TOKEN }}
      TARGET_URL: https://www.flowtennis.cn/api/cron/feishu-coach-daily-digests
      COACH_NAME: ${{ inputs.coachName || '' }}
      MARK_SENT: ${{ inputs.markSent || 'true' }}
      FORCE: ${{ inputs.force || 'false' }}
      PHONE_OVERRIDES: ${{ secrets.FEISHU_COACH_DIGEST_PHONE_OVERRIDES || '' }}
      OPEN_ID_OVERRIDES: ${{ secrets.FEISHU_COACH_DIGEST_OPEN_ID_OVERRIDES || '' }}

    steps:
      - name: Trigger feishu coach digest endpoint
        shell: bash
        run: |
          query="$(node -e 'const p=new URLSearchParams(); if(process.env.COACH_NAME)p.set("coachName",process.env.COACH_NAME); if(process.env.MARK_SENT)p.set("markSent",process.env.MARK_SENT); if(process.env.FORCE)p.set("force",process.env.FORCE); process.stdout.write(p.toString() ? `?${p}` : "");')"
          curl_args=(-fsS -X GET "$TARGET_URL$query" -H "User-Agent: vercel-cron")
          if [ -n "${CRON_SECRET:-}" ]; then
            curl_args+=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi
          if [ -n "${PHONE_OVERRIDES:-}" ]; then
            curl_args+=(-H "X-Feishu-Coach-Digest-Phone-Overrides: ${PHONE_OVERRIDES}")
          fi
          if [ -n "${OPEN_ID_OVERRIDES:-}" ]; then
            curl_args+=(-H "X-Feishu-Coach-Digest-Open-Id-Overrides: ${OPEN_ID_OVERRIDES}")
          fi
          curl "${curl_args[@]}"

name: FlowTennis CI Guard

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Dependency security guard
        run: npm run guard:deps-security
        working-directory: .

      - name: Run critical tests
        run: npm test
        working-directory: .

      - name: Finance regression guard
        run: npm run guard:finance
        working-directory: .

name: Feishu Schedule Sync

on:
  schedule:
    - cron: '0 0,10 * * *'
  workflow_dispatch:
    inputs:
      history:
        description: '是否按历史区间运行'
        required: false
        default: 'false'
      startDate:
        description: '历史开始日期 YYYY-MM-DD'
        required: false
        default: ''
      endDate:
        description: '历史结束日期 YYYY-MM-DD'
        required: false
        default: ''
      dryRun:
        description: '是否只 dry-run'
        required: false
        default: 'true'
      notify:
        description: 'dry-run 是否发群通知'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  sync-feishu-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.FLOWTENNIS_ADMIN_TOKEN }}
      TARGET_URL: https://www.flowtennis.cn/api/cron/feishu-schedule-sync

    steps:
      - name: Trigger feishu schedule sync endpoint
        shell: bash
        run: |
          target="$TARGET_URL"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            params=()
            [ -n "${{ github.event.inputs.history }}" ] && params+=("history=${{ github.event.inputs.history }}")
            [ -n "${{ github.event.inputs.startDate }}" ] && params+=("startDate=${{ github.event.inputs.startDate }}")
            [ -n "${{ github.event.inputs.endDate }}" ] && params+=("endDate=${{ github.event.inputs.endDate }}")
            [ -n "${{ github.event.inputs.dryRun }}" ] && params+=("dryRun=${{ github.event.inputs.dryRun }}")
            [ -n "${{ github.event.inputs.notify }}" ] && params+=("notify=${{ github.event.inputs.notify }}")
            if [ "${#params[@]}" -gt 0 ]; then
              joined=$(IFS='&'; echo "${params[*]}")
              target="${TARGET_URL}?${joined}"
            fi
          fi
          curl_args=(-fsS -X GET "$target" -H "User-Agent: vercel-cron")
          if [ -n "${CRON_SECRET:-}" ]; then
            curl_args+=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi
          mkdir -p feishu-sync-output
          curl "${curl_args[@]}" -o feishu-sync-output/result.json
          node - feishu-sync-output/result.json <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const s = data.plan?.summary || {};
          console.log(`mode=${data.mode || ''} dryRun=${data.dryRun} courseCount=${data.courseCount}`);
          console.log(`bindExisting=${s.bindExisting || 0} create=${s.create || 0} createTrial=${s.createTrial || 0} update=${s.update || 0} pendingDelete=${s.pendingDelete || 0} notifyError=${s.notifyError || 0}`);
          const n = data.notification || {};
          console.log(`notification sent=${n.sent === true} skipped=${n.skipped === true} error=${n.error || data.notificationError || ''}`);
          const errors = (data.plan?.actions || []).filter((item) => item.type === 'notify_error').slice(0, 20);
          errors.forEach((item, index) => {
            const c = item.candidate || {};
            console.log(`error#${index + 1} ${c.date || ''} ${c.startClock || ''}-${c.endClock || ''} ${c.coachName || ''} ${c.courseText || ''} ${c.studentText || ''} :: ${item.reason || ''}`);
          });
          NODE

      - name: Upload feishu sync result
        uses: actions/upload-artifact@v4
        with:
          name: feishu-schedule-sync-result
          path: feishu-sync-output/result.json

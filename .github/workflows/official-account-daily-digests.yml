name: Official Account Daily Digests

on:
  schedule:
    - cron: '2 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-official-account-digests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      TARGET_URL: https://www.flowtennis.cn/api/cron/official-account-daily-digests

    steps:
      - name: Trigger digest endpoint
        shell: bash
        run: |
          curl_args=(-fsS -X GET "$TARGET_URL" -H "User-Agent: vercel-cron")
          if [ -n "${CRON_SECRET:-}" ]; then
            curl_args+=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi
          curl "${curl_args[@]}"

name: Feishu Daily Report

on:
  workflow_dispatch:
  schedule:
    - cron: '13 12 * * *'

permissions:
  contents: read

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.FLOWTENNIS_ADMIN_TOKEN }}
      TARGET_URL: https://www.flowtennis.cn/api/cron/feishu-daily-report

    steps:
      - name: Trigger Feishu daily report endpoint
        shell: bash
        run: |
          curl_args=(-fsS -X GET "$TARGET_URL" -H "User-Agent: vercel-cron")
          if [ -n "${CRON_SECRET:-}" ]; then
            curl_args+=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi
          curl "${curl_args[@]}"

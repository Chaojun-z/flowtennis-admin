<body>
<div class="login-page" id="loginPage">
  <div class="login-card">
    <div class="login-logo"><span class="icon"></span><div class="brand">网球兄弟</div><div class="sub">FlowTennis · 管理系统</div></div>
    <div class="login-err" id="loginErr"></div>
    <label class="login-label">账号ID</label>
    <input class="login-input" id="loginUser" placeholder="请输入账号ID（不是姓名）" autocomplete="username">
    <label class="login-label">密码</label>
    <input class="login-input" id="loginPass" type="password" placeholder="请输入密码" autocomplete="current-password">
    <button class="login-btn" id="loginBtn" onclick="doLogin()">登 录</button>
  </div>
</div>

<div id="app" style="display:none;width:100%;min-height:100vh">
<div id="sidebarHost"></div>

<div class="main">
  <div id="topbarHost"></div>
  <div class="content">
    <!-- 线索池 -->
    <div class="page-section" id="page-leads" data-standard-list-shell="leads"></div>
    <!-- 学员信息 -->
    <div class="page-section active" id="page-students" data-standard-list-shell="students"></div>
    <!-- 排课表 -->
    <div class="page-section" id="page-schedule" data-standard-list-shell="schedule"></div>
    <!-- 教练排课 -->
    <div class="page-section" id="page-coachschedule">
      <div class="coach-ops-grid-card is-loading mode-day" style="--coach-ops-day-coach-count:8;--coach-ops-day-grid-width:1280px">
        <div class="coach-ops-sticky-head">
          <div class="coach-ops-sticky-surface">
            <div class="coach-ops-sticky-bg"></div>
            <div class="coach-ops-shell">
                <div class="coach-ops-toolbar">
                  <div class="coach-ops-toolbar-main">
                  <button class="coach-ops-nav" onclick="setCoachOpsToday()">今天</button>
                  <button class="coach-ops-nav coach-ops-arrow" id="coachOpsPrevBtn" onclick="shiftCoachOpsDate(-1)" data-tip="前一天" aria-label="前一天"><svg viewBox="0 0 1024 1024" aria-hidden="true"><path d="M303.872 541.952c-7.68 0-15.36-2.944-21.12-8.704-11.648-11.648-11.648-30.592 0-42.24L699.008 74.624c11.648-11.648 30.592-11.648 42.24 0 11.648 11.648 11.648 30.592 0 42.24L324.992 533.12c-5.888 5.888-13.44 8.832-21.12 8.832z"></path><path d="M720.128 958.208c-7.68 0-15.36-2.944-21.12-8.704L282.752 533.12c-11.648-11.648-11.648-30.592 0-42.24 11.648-11.648 30.592-11.648 42.24 0l416.256 416.256c11.648 11.648 11.648 30.592 0 42.24-5.76 5.888-13.44 8.832-21.12 8.832z"></path></svg></button>
                  <button class="coach-ops-nav coach-ops-arrow is-next" id="coachOpsNextBtn" onclick="shiftCoachOpsDate(1)" data-tip="后一天" aria-label="后一天"><svg viewBox="0 0 1024 1024" aria-hidden="true"><path d="M303.872 541.952c-7.68 0-15.36-2.944-21.12-8.704-11.648-11.648-11.648-30.592 0-42.24L699.008 74.624c11.648-11.648 30.592-11.648 42.24 0 11.648 11.648 11.648 30.592 0 42.24L324.992 533.12c-5.888 5.888-13.44 8.832-21.12 8.832z"></path><path d="M720.128 958.208c-7.68 0-15.36-2.944-21.12-8.704L282.752 533.12c-11.648-11.648-11.648-30.592 0-42.24 11.648-11.648 30.592-11.648 42.24 0l416.256 416.256c11.648 11.648 11.648 30.592 0 42.24-5.76 5.888-13.44 8.832-21.12 8.832z"></path></svg></button>
                  <div class="coach-date-wrap">
                    <input id="coachOpsDate" type="hidden" value="">
                    <button class="coach-date-btn" id="coachOpsDateBtn" onclick="toggleCoachOpsPicker(event)" type="button"></button>
                    <div class="coach-date-pop" id="coachOpsPicker"></div>
                  </div>
                </div>
                <div class="coach-ops-toolbar-right">
                  <div class="coach-ops-legend" id="coachOpsLegend"></div>
                  <div id="coachOpsRangeHost"></div>
                </div>
              </div>
            </div>
            <div class="coach-ops-head"><div class="coach-ops-corner"></div><div class="coach-ops-hours" id="coachOpsHours"></div></div>
          </div>
        </div>
        <div class="coach-ops-scroll">
          <div id="coachOpsTimeline" class="is-skeleton">
            <div class="coach-ops-day-loading-panel"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- 教练工作量 -->
    <div class="page-section" id="page-coachops" data-standard-list-shell="coachops"></div>
    <div class="page-section" id="page-operations"></div>
    <div class="page-section" id="page-finance">
      <div id="financeLedgerPanel">
      <div id="financeLedgerLoading" class="finance-loading-card" style="display:none">
        <div class="finance-loading-title">总账加载中</div>
        <div class="finance-loading-desc">先把这一页数据加载完整，再展示筛选和表格。</div>
        </div>
        <div id="financeLedgerReady" class="section-stack" data-standard-list-shell="finance-ledger"></div>
      </div>
      <div id="financeRevenuePanel" class="section-stack" data-standard-list-shell="finance-revenue" style="display:none"></div>
      <div id="financeRecognizedPanel" class="section-stack" data-standard-list-shell="finance-recognized" style="display:none"></div>
      <div id="financeSettlementPanel" class="section-stack" style="display:none">
        <div class="tms-audit-note">教练结算这一期只看两件事：已完成课时数、迟到承担场地费。</div>
        <div class="tms-stats-row" id="financeSettlementStats"></div>
        <div class="tms-toolbar finance-settlement-toolbar">
          <div class="tms-filters">
            <div class="tms-form-item finance-settlement-month-field">
              <label class="tms-form-label">结算月份</label>
              <input class="finput tms-form-control" id="financeSettlementMonth" type="month" onchange="renderFinanceSettlementSummary()">
            </div>
          </div>
          <div class="tms-toolbar-right">
            <button class="tms-btn tms-btn-ghost" onclick="openCoachLateSettlementModal()">查看迟到月结</button>
          </div>
        </div>
        <div class="tms-table-card"><div class="tms-table-wrapper"><table class="tms-table"><thead><tr><th style="width:140px;padding-left:20px">教练</th><th style="width:120px">校区</th><th style="width:120px">已完成课时数</th><th style="width:120px">迟到记录</th><th style="width:140px">承担场地费</th></tr></thead><tbody id="financeSettlementTbody"></tbody></table></div></div>
      </div>
    </div>
    <div class="page-section" id="page-matches" data-standard-list-shell="matches"></div>
    <div class="page-section" id="page-third-party-sync" data-standard-list-shell="third-party-sync"></div>
    <!-- 教练管理 -->
    <div class="page-section" id="page-coaches" data-standard-list-shell="coaches"></div>
    <!-- 账号管理 -->
    <div class="page-section" id="page-admin-users" data-standard-list-shell="admin-users"></div>
    <!-- 订场用户 -->
    <div class="page-section" id="page-courts" data-standard-list-shell="courts"></div>
    <!-- 会员管理 -->
    <div class="page-section" id="page-memberships" data-standard-list-shell="memberships"></div>
    <div class="page-section" id="page-membership-orders" data-standard-list-shell="membership-orders"></div>
    <div class="page-section" id="page-membership-ledger" data-standard-list-shell="membership-ledger"></div>
    <!-- 会员方案 -->
    <div class="page-section" id="page-membership-plans" data-standard-list-shell="membership-plans"></div>
    <!-- 课程产品 -->
    <div class="page-section" id="page-products" data-standard-list-shell="products"></div>
    <!-- 售卖课包 -->
    <div class="page-section" id="page-packages" data-standard-list-shell="packages"></div>
    <!-- 购买记录 -->
    <div class="page-section" id="page-purchases" data-standard-list-shell="purchases"></div>
    <!-- 课包余额（已隐藏入口，仅保留底层审计页） -->
    <div class="page-section" id="page-entitlements" data-standard-list-shell="entitlements"></div>
    <!-- 工作台（教练视角） -->
    <div class="page-section" id="page-workbench">
      <div id="workbenchBody"></div>
    </div>
    <!-- 课后评价（教练视角） -->
    <div class="page-section" id="page-postfeedback">
      <div id="postFeedbackBody"></div>
    </div>
    <!-- 我的学员（教练视角） -->
    <div class="page-section" id="page-mystudents" data-standard-list-shell="mystudents"></div>
    <!-- 我的班次（教练视角） -->
    <div class="page-section" id="page-myclasses" data-standard-list-shell="myclasses"></div>
    <!-- 校区管理 -->
    <div class="page-section" id="page-campusmgr" data-standard-list-shell="campusmgr"></div>
    <!-- 价格管理 -->
    <div class="page-section" id="page-prices" data-standard-list-shell="prices"></div>
</div>
</div>
</div>
<div class="page-loading" id="pageLoading"><div class="ios-spinner-box"><div class="ios-spinner"></div><div class="ios-spinner-text">加载数据...</div></div></div>

  <div class="modal"><div class="mhead"><div class="mtitle" id="mTitle">操作</div><button class="mclose close-x" type="button" aria-label="关闭" title="关闭" onclick="closeModal()"><svg class="mclose-svg" width="9" height="9" viewBox="0 0 9 9" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4.4978 3.7938L8.1458 0.145803C8.23916 0.052447 8.36578 -3.11063e-09 8.4978 0C8.62983 3.11063e-09 8.75645 0.052447 8.8498 0.145803C8.94316 0.239159 8.99561 0.365778 8.99561 0.497803C8.99561 0.629829 8.94316 0.756447 8.8498 0.849804L5.2018 4.4978L8.8498 8.1458C8.94316 8.23916 8.99561 8.36578 8.99561 8.4978C8.99561 8.62983 8.94316 8.75645 8.8498 8.8498C8.75645 8.94316 8.62983 8.99561 8.4978 8.99561C8.36578 8.99561 8.23916 8.94316 8.1458 8.8498L4.4978 5.2018L0.849803 8.8498C0.756447 8.94316 0.629829 8.99561 0.497803 8.99561C0.365778 8.99561 0.239159 8.94316 0.145803 8.8498C0.052447 8.75645 9.83668e-10 8.62983 0 8.4978C-9.83667e-10 8.36578 0.052447 8.23916 0.145803 8.1458L3.7938 4.4978L0.145803 0.849804C0.052447 0.756447 -1.96733e-09 0.629829 0 0.497803C1.96734e-09 0.365778 0.052447 0.239159 0.145803 0.145803C0.239159 0.052447 0.365778 1.96734e-09 0.497803 0C0.629829 -1.96733e-09 0.756447 0.052447 0.849803 0.145803L4.4978 3.7938Z" fill="currentColor"/></svg></button></div><div class="mbody" id="mBody"></div><div class="mactions" id="mActions" style="display:none"></div></div>

    <div style="margin:12px 0"><input class="finput" id="confInput" placeholder="请输入「确认删除」" style="text-align:center;font-size:13px"></div><div class="conf-acts"><button class="conf-no" id="confNoBtn" onclick="closeConf()">取消</button><button class="conf-yes" id="confYesBtn" onclick="doDelete()" disabled style="opacity:0.4;cursor:not-allowed">确认删除</button></div>
